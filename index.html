    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-bubble {
            font-family: 'Fredoka One', cursive;
        }
        
        /* Floating Bubbles Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
        .popping {
            animation: pop 0.25s forwards;
        }

        /* Bubble Style */
        .bubble-btn {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #60a5fa 60%, #2563eb 100%);
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.3), inset 0 -4px 6px rgba(0,0,0,0.2), inset 0 4px 6px rgba(255,255,255,0.8);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            transition: transform 0.1s active;
        }
        .bubble-btn:active {
            transform: scale(0.92);
        }

        .bubble-gold {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fbbf24 60%, #d97706 100%);
            box-shadow: 0 8px 15px rgba(217, 119, 6, 0.3), inset 0 -4px 6px rgba(0,0,0,0.2), inset 0 4px 6px rgba(255,255,255,0.8);
        }

        .bubble-pink {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f472b6 60%, #db2777 100%);
            box-shadow: 0 8px 15px rgba(219, 39, 119, 0.3), inset 0 -4px 6px rgba(0,0,0,0.2), inset 0 4px 6px rgba(255,255,255,0.8);
        }

        .bubble-green {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #4ade80 60%, #16a34a 100%);
            box-shadow: 0 8px 15px rgba(22, 163, 74, 0.3), inset 0 -4px 6px rgba(0,0,0,0.2), inset 0 4px 6px rgba(255,255,255,0.8);
        }

        .bubble-purple {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #c084fc 60%, #9333ea 100%);
            box-shadow: 0 8px 15px rgba(147, 51, 234, 0.3), inset 0 -4px 6px rgba(0,0,0,0.2), inset 0 4px 6px rgba(255,255,255,0.8);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Custom Scrollbar for list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 10px;
        }
    </style>

    <!-- AUDIO ENGINE & GAME SCRIPT -->
    <script>
        // Web Audio API Synthesizer
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playPop() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playCorrect() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.2);
                });
            },
            playWrong() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        };

            document.getElementById('screenCategory').classList.remove('hidden');

            currentCategory = catKey;
            wordList = [...WORD_DATA[catKey]];
            // Shuffle word list
            wordList.sort(() => Math.random() - 0.5);
            currentIndex = 0;

            // Highlight active pill in the quick category bar
            document.querySelectorAll('.cat-pill').forEach(pill => {
                if (pill.dataset.cat === catKey) {
                    pill.className = "cat-pill shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-pink-500 text-white border border-pink-600 shadow-md transition";

                }
            });

            document.getElementById('screenCategory').classList.add('hidden');
            document.getElementById('screenGame').classList.remove('hidden');

            loadWord();
        }

        }

        function speakCurrentWord() {
            if ('speechSynthesis' in window && currentWordObj) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance(currentWordObj.word);
                utterance.rate = 0.85; // Slightly slower for kids
                utterance.pitch = 1.1; // Cheerful tone
                window.speechSynthesis.speak(utterance);
            }
        }

        function renderGameLayout() {
            const wordSlots = document.getElementById('wordSlots');
            const interactiveArea = document.getElementById('interactiveArea');
            const helperText = document.getElementById('helperText');

            wordSlots.innerHTML = '';
            interactiveArea.innerHTML = '';

            if (currentMode === 'pop') {
                helperText.textContent = "Pop the letter bubbles in the correct order!";
                
                // Slots
                targetLetters.forEach((_, idx) => {
                    const slot = document.createElement('div');
                    slot.className = "w-10 h-12 sm:w-12 sm:h-14 border-b-4 border-indigo-400 bg-indigo-50/50 rounded-xl flex items-center justify-center font-bubble text-2xl text-indigo-900 shadow-inner";
                    slot.id = `slot-${idx}`;
                    wordSlots.appendChild(slot);
                });

                // Bubbles (Scrambled + random extra distractor)
                let bubbleLetters = [...targetLetters];
                const alphabet = 'abcdefghijklmnopqrstuvwxyz';
                bubbleLetters.push(alphabet[Math.floor(Math.random() * alphabet.length)]);
                bubbleLetters.sort(() => Math.random() - 0.5);

                const bubbleContainer = document.createElement('div');
                bubbleContainer.className = "flex flex-wrap justify-center items-center gap-3 max-w-xs";

                const colors = ['bubble-btn', 'bubble-pink', 'bubble-gold', 'bubble-green', 'bubble-purple'];

                bubbleLetters.forEach((char, idx) => {
                    const btn = document.createElement('button');
                    const colorClass = colors[idx % colors.length];
                    btn.className = `w-14 h-14 sm:w-16 sm:h-16 rounded-full text-white font-bubble text-2xl sm:text-3xl flex items-center justify-center floating ${colorClass} active:scale-90 transition`;
                    btn.textContent = char;
                    btn.style.animationDelay = `${(idx * 0.2).toFixed(1)}s`;

                    btn.onclick = (e) => handlePopTap(btn, char);
                    bubbleContainer.appendChild(btn);
                });

                interactiveArea.appendChild(bubbleContainer);

            } else if (currentMode === 'type') {
                helperText.textContent = "Tap the letter tiles to spell out the word!";

                // Slots
                targetLetters.forEach((_, idx) => {
                    const slot = document.createElement('div');
                    slot.className = "w-10 h-12 sm:w-12 sm:h-14 border-b-4 border-purple-400 bg-purple-50/50 rounded-xl flex items-center justify-center font-bubble text-2xl text-purple-900 shadow-inner";
                    slot.id = `slot-${idx}`;
                    wordSlots.appendChild(slot);
                });

                // Keyboard Tiles
                let keyboardLetters = [...targetLetters];
                // Fill up to 8 tiles with distractors
                const extraChars = 'abcdefghijklmnopqrstuvwxyz'.split('');
                while (keyboardLetters.length < 8) {
                    const rand = extraChars[Math.floor(Math.random() * extraChars.length)];
                    if (!keyboardLetters.includes(rand)) keyboardLetters.push(rand);
                }
                keyboardLetters.sort(() => Math.random() - 0.5);

                const keyGrid = document.createElement('div');
                keyGrid.className = "grid grid-cols-4 gap-2.5 max-w-xs w-full";

                keyboardLetters.forEach(char => {
                    const btn = document.createElement('button');
                    btn.className = "bg-white hover:bg-purple-50 text-purple-900 font-bubble text-2xl py-3 rounded-2xl shadow-md border-b-4 border-purple-200 active:translate-y-1 transition flex items-center justify-center";
                    btn.textContent = char;
                    btn.onclick = () => handleTypeTap(btn, char);
                    keyGrid.appendChild(btn);
                });

                // Clear/Backspace Button
                const backBtn = document.createElement('button');
                backBtn.className = "col-span-4 mt-2 bg-pink-100 text-pink-700 font-bold py-2 rounded-xl border border-pink-300 text-sm flex items-center justify-center gap-1 active:scale-95 transition";
                backBtn.innerHTML = "⌫ Clear Letters";
                backBtn.onclick = () => {
                    userSpelled = [];
                    targetLetters.forEach((_, idx) => {
                        const slot = document.getElementById(`slot-${idx}`);
                        if (slot) slot.textContent = '';
                    });
                };
                keyGrid.appendChild(backBtn);

                interactiveArea.appendChild(keyGrid);
            }
        }

        // MODE 1 LOGIC: Bubble Pop
        function handlePopTap(btn, char) {
            AudioFX.playPop();

            const expectedChar = targetLetters[userSpelled.length];

            if (char.toLowerCase() === expectedChar) {
                // Correct letter popped!
                userSpelled.push(char.toLowerCase());

                // Add pop effect
                btn.classList.add('popping');
                setTimeout(() => btn.style.visibility = 'hidden', 200);

                // Update slot
                const slotIndex = userSpelled.length - 1;
                const slot = document.getElementById(`slot-${slotIndex}`);
                if (slot) {
                    slot.textContent = char;
                    slot.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                }

                // Check Win
                if (userSpelled.length === targetLetters.length) {
                    onWordComplete();
                }
            } else {
                // Wrong letter
                AudioFX.playWrong();
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 400);
            }
        }

        // MODE 2 LOGIC: Typing/Tile Tap
        function handleTypeTap(btn, char) {
            if (userSpelled.length >= targetLetters.length) return;

            AudioFX.playPop();
            userSpelled.push(char.toLowerCase());

            const slotIndex = userSpelled.length - 1;
            const slot = document.getElementById(`slot-${slotIndex}`);
            if (slot) slot.textContent = char;

            // When full, check word
            if (userSpelled.length === targetLetters.length) {
                const builtWord = userSpelled.join('');
                if (builtWord === targetLetters.join('')) {
                    onWordComplete();
                } else {
                    AudioFX.playWrong();
                    const card = document.getElementById('wordSlots');
                    card.classList.add('shake');
                    setTimeout(() => card.classList.remove('shake'), 400);
                }
            }
        }

        // WORD COMPLETION & FEEDBACK HANDLING
        function onWordComplete() {
            // Audio Chime & Speech Feedback
            AudioFX.playCorrect();
            
            if ('speechSynthesis' in window) {
                setTimeout(() => {
                    window.speechSynthesis.cancel();
                    const praiseList = ["Great job!", "Awesome!", "You did it!", "Super star!"];
                    const randomPraise = praiseList[Math.floor(Math.random() * praiseList.length)];
                    const utterance = new SpeechSynthesisUtterance(`${randomPraise} ${currentWordObj.word}`);
                    utterance.pitch = 1.2;
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }, 200);
            }

            // Stats Update
            stars += 10;
            streak += 1;
            document.getElementById('starCount').textContent = stars;
            document.getElementById('streakCount').textContent = streak;

            // Trigger Confetti Explosion
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }

            // Show Success Modal
            const modal = document.getElementById('successModal');
            document.getElementById('modalWordText').textContent = `⭐ ${currentWordObj.word.toUpperCase()} ⭐`;
            modal.classList.remove('hidden');
        }

        function nextWord() {
            // Hide Modal
            document.getElementById('successModal').classList.add('hidden');
            
            // Advance Word Index
            currentIndex++;
            loadWord();
        }

        function skipWord() {
            streak = 0;
            document.getElementById('streakCount').textContent = streak;
            currentIndex++;
            loadWord();
        }
    </script>
</body>
</html>
